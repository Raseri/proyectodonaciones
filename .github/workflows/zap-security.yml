name: OWASP ZAP Security Scan

on:
  workflow_dispatch:

jobs:
  zap-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OWASP ZAP
        run: |
          wget -q https://github.com/zaproxy/zaproxy/releases/download/v2.16.1/ZAP_2.16.1_Linux.tar.gz -O zap.tar.gz
          mkdir -p zap-tool
          tar -xzf zap.tar.gz -C zap-tool --strip-components=1
          chmod +x zap-tool/zap.sh

      - name: Run OWASP ZAP
        env:
          TARGET_URL: https://TU-FRONTEND.onrender.com
          ZAP_PATH: ${{ github.workspace }}/zap-tool/zap.sh
        run: npm run security:zap:baseline

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14