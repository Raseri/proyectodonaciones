name: OWASP ZAP Security Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zap-scan:
    name: ZAP scan for auth and access control
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start backend
        run: |
          npm run backend > backend.log 2>&1 &
          sleep 10

      - name: Install OWASP ZAP
        run: |
          wget -q https://github.com/zaproxy/zaproxy/releases/download/v2.16.1/ZAP_2.16.1_Linux.tar.gz -O zap.tar.gz
          mkdir -p zap-tool
          tar -xzf zap.tar.gz -C zap-tool --strip-components=1
          echo "$PWD/zap-tool" >> $GITHUB_PATH

      - name: Run ZAP baseline scan
        env:
          TARGET_URL: http://localhost:3000
        run: npm run security:zap:baseline

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/
          if-no-files-found: warn
