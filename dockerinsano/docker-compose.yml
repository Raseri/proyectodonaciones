services:
  # ── Backend (Express + SQLite)
  backend:
    build:
      context: ..
      dockerfile: dockerinsano/Dockerfile.backend
    container_name: donaciones-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - db-data:/app/backend/data
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend (Nginx + Vite build) ───────────
  frontend:
    build:
      context: ..
      dockerfile: dockerinsano/Dockerfile.frontend
    container_name: donaciones-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
    driver: local
